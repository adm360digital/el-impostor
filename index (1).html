const PREFS_KEY = 'el-impostor-settings-v2';
const SESSION_KEY = 'el-impostor-session-v2';
const DEFAULTS = {names:'Jugador 1\nJugador 2\nJugador 3\nJugador 4\nJugador 5',impostors:1,category:'Todas',minutes:3,customWords:''};
const app = document.getElementById('app');
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').trim();
function loadPrefs(){
  try {const v=JSON.parse(localStorage.getItem(PREFS_KEY)||localStorage.getItem('el-impostor-settings-v1')||'{}');return {...DEFAULTS,...v}}
  catch {return {...DEFAULTS}}
}
function writePrefs(cfg){try{localStorage.setItem(PREFS_KEY,JSON.stringify(cfg))}catch{}}
function initialState(){return {screen:'setup',config:loadPrefs(),players:[],impostorIds:[],word:'',round:0,starter:'',active:0,visible:false,seen:false,seconds:0,deadline:0,paused:false,timerId:null,selected:new Set(),scores:{team:0,impostors:0},counts:[],previous:[],recent:[],win:null,error:''}}
let state=initialState();
function persist(){
  if(state.screen==='setup')return;
  try {
    const {timerId,visible,selected,error,...snapshot}=state;
    sessionStorage.setItem(SESSION_KEY,JSON.stringify({...snapshot,visible:false,selected:[...selected],savedAt:Date.now()}));
  }catch{}
}
function loadSession(){
  try {
    const v=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');
    if(!v || !['roles','ready','playing','vote','results'].includes(v.screen))return;
    if(!Array.isArray(v.players)||v.players.length<3||v.players.length>16||!Array.isArray(v.impostorIds)||!v.impostorIds.length||!v.word||!v.config)return;
    state={...state,...v,visible:false,paused:Boolean(v.paused),seen:Boolean(v.seen),selected:new Set(v.selected||[]),timerId:null,error:''};
    if(state.screen==='playing'&&!state.paused&&state.config.minutes>0){state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}
  } catch {try{sessionStorage.removeItem(SESSION_KEY)}catch{}}
}
function clearSession(){try{sessionStorage.removeItem(SESSION_KEY)}catch{}}
function rand(max){
  if(max<=1)return 0;
  if(globalThis.crypto?.getRandomValues){
    const limit=Math.floor(4294967296/max)*max, buf=new Uint32Array(1);let n;
    do {crypto.getRandomValues(buf);n=buf[0]} while(n>=limit);
    return n%max;
  }
  return Math.floor(Math.random()*max);
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function parseNames(raw){return String(raw).split(/[\n;,]+/).map(s=>s.trim()).filter(Boolean)}
function parseWords(raw){return [...new Map(String(raw).split(/[\n;]+/).map(s=>s.trim()).filter(Boolean).map(s=>[normalize(s),s])).values()]}
function allWords(){return Object.values(BANK).flat()}
function categoryWords(category,cfg){if(category==='Mi lista')return parseWords(cfg.customWords);return category==='Todas'?allWords():(BANK[category]||allWords())}
function pickWord(category,cfg){
  const pool=categoryWords(category,cfg);
  const seen=new Set(state.recent.map(normalize));
  let available=pool.filter(w=>!seen.has(normalize(w)));
  if(!available.length){state.recent=[];available=pool}
  const word=available[rand(available.length)];
  state.recent.push(word);
  if(state.recent.length>Math.max(1,pool.length-1))state.recent.shift();
  return word;
}
function pickImpostors(n,k){
  const counts=Array.from({length:n},(_,i)=>state.counts[i]||0);
  const ordered=shuffle([...Array(n).keys()]);
  ordered.sort((a,b)=>(counts[a]+(state.previous.includes(a)?0.7:0))-(counts[b]+(state.previous.includes(b)?0.7:0)));
  const chosen=ordered.slice(0,k);
  chosen.forEach(i=>{counts[i]+=1});
  state.counts=counts;state.previous=[...chosen];
  return chosen;
}
function pill(s){return `<span class="pill"><span class="dot"></span>${esc(s)}</span>`}
function header(kicker,title,desc){return `<header class="stage-head">${pill(kicker)}<h1 tabindex="-1" id="stage-title">${esc(title)}</h1><p>${esc(desc)}</p></header>`}
function navigate(){window.scrollTo(0,0);const h=document.getElementById('stage-title');if(h)h.focus({preventScroll:true})}
function haltTimer(){if(state.timerId!==null){clearInterval(state.timerId);state.timerId=null}}
function render(){haltTimer();
  if(state.screen==='setup')renderSetup();
  else if(state.screen==='roles')renderRoles();
  else if(state.screen==='ready')renderReady();
  else if(state.screen==='playing')renderPlaying();
  else if(state.screen==='vote')renderVote();
  else if(state.screen==='results')renderResults();
  persist();
}
function go(screen){state.screen=screen;render();navigate()}
function abandon(){
  hideSecret();
  if(!confirm('¿Salir de la partida? Se perderá el marcador de esta sesión.'))return;
  haltTimer();clearSession();state=initialState();render();navigate();
}
function exitButton(){return `<button id="leave-game" type="button" class="tiny-btn exit-link">Salir de la partida</button>`}
function wireExit(){document.getElementById('leave-game')?.addEventListener('click',abandon)}
function renderSetup(){
  const cfg=state.config;
  const cats=['Todas',...Object.keys(BANK),'Mi lista'];
  app.innerHTML=`<div class="landing">
  <section class="hero">${pill('Un móvil · Todos contra el impostor')}<h1>UNO DE <span>VOSOTROS</span> MIENTE.</h1><p class="lede">Todos reciben una palabra secreta… menos el impostor. Una pista cada uno. ¿Quién está improvisando?</p><div class="features"><span class="feature">3–16 jugadores</span><span class="feature">${allWords().length} palabras</span><span class="feature">Gratis y sin cuentas</span></div><div class="graphic" aria-hidden="true"><div class="glow"></div><div class="poster-shadow"></div><div class="poster"><div class="q">?</div></div><div class="seal">SOSPECHOSO</div></div></section>
  <section class="setup" aria-label="Configuración de la partida"><div class="panel-title"><h2>Preparar partida</h2><span class="mini-id">MODO PRESENCIAL</span></div><p class="helper">Preparad un solo teléfono y pasadlo de mano en mano.</p>
  <form id="game-form" novalidate><div class="field"><label for="names">Participantes <span class="sub-label">(uno por línea)</span></label><textarea class="textarea" id="names" name="names" spellcheck="false" maxlength="550" placeholder="Ana&#10;Pablo&#10;Marta">${esc(cfg.names)}</textarea><small>De 3 a 16 jugadores. Se admiten nombres con espacios.</small></div>
  <div class="field-grid"><div class="field"><label for="impostors">Impostores</label><select class="select" id="impostors" name="impostors">${[1,2,3].map(n=>`<option value="${n}" ${Number(cfg.impostors)===n?'selected':''}>${n} impostor${n===1?'':'es'}</option>`).join('')}</select></div><div class="field"><label for="minutes">Tiempo</label><select class="select" id="minutes" name="minutes">${[[0,'Sin límite'],[2,'2 min'],[3,'3 min'],[5,'5 min'],[8,'8 min']].map(([n,t])=>`<option value="${n}" ${Number(cfg.minutes)===n?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="field"><label for="category">Categoría de palabras</label><select class="select" id="category" name="category">${cats.map(n=>`<option value="${esc(n)}" ${n===cfg.category?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
  <div class="field" id="custom-wrap" ${cfg.category==='Mi lista'?'':'hidden'}><label for="custom">Tus palabras <span class="sub-label">(una por línea, mínimo 5)</span></label><textarea class="textarea custom-area" id="custom" name="custom" maxlength="5000" placeholder="Tiburón&#10;Biblioteca&#10;Chocolate&#10;Paraguas&#10;Aeropuerto">${esc(cfg.customWords||'')}</textarea><small>Solo se usarán tus palabras. Se guardan en este dispositivo.</small></div>
  ${state.error?`<div class="error" role="alert">${esc(state.error)}</div>`:''}
  <button class="btn btn-primary btn-wide" type="submit">Repartir papeles <span aria-hidden="true">→</span></button></form>
  <details class="rules"><summary>¿Cómo se juega?</summary><ol><li>Cada participante descubre en secreto si conoce la palabra o es el impostor.</li><li>Por turnos, todos dicen <strong>una pista relacionada</strong>, sin pronunciar la palabra ni repetir pistas.</li><li>Debatid y votad por los sospechosos.</li><li>Si descubrís a <strong>todos</strong> los impostores, gana el equipo. Si alguno escapa, ganan los impostores.</li></ol></details>
  </section></div>`;
  const form=document.getElementById('game-form');
  form.querySelector('#category').addEventListener('change',e=>{document.getElementById('custom-wrap').hidden=e.target.value!=='Mi lista'});
  form.addEventListener('submit',e=>{
    e.preventDefault();const els=form.elements;
    const cfg={names:els.namedItem('names').value,impostors:Number(els.namedItem('impostors').value),minutes:Number(els.namedItem('minutes').value),category:els.namedItem('category').value,customWords:els.namedItem('custom').value};
    state.config=cfg;writePrefs(cfg);
    const players=parseNames(cfg.names);let error='';
    if(players.length<3||players.length>16)error='Introducid entre 3 y 16 jugadores.';
    else if(new Set(players.map(normalize)).size!==players.length)error='Hay nombres repetidos. Cada jugador necesita uno diferente.';
    else if(players.some(x=>x.length>35))error='Cada nombre debe tener 35 caracteres o menos.';
    else if(cfg.impostors>players.length-2)error='Deben quedar al menos dos jugadores que conozcan la palabra.';
    else if(cfg.category==='Mi lista'&&parseWords(cfg.customWords).length<5)error='Añade al menos cinco palabras diferentes a tu lista.';
    else if(cfg.category==='Mi lista'&&parseWords(cfg.customWords).some(x=>x.length>55))error='Las palabras de tu lista deben tener menos de 56 caracteres.';
    if(error){state.error=error;renderSetup();return;}
    state.error='';state.scores={team:0,impostors:0};state.counts=[];state.previous=[];state.recent=[];state.round=0;
    startRound(players,cfg);
  });
}
function startRound(players,cfg){
  haltTimer();state.players=[...players];state.config={...cfg};state.round++;
  state.word=pickWord(cfg.category,cfg);
  state.impostorIds=pickImpostors(players.length,cfg.impostors);
  state.starter=players[rand(players.length)];
  state.active=0;state.visible=false;state.seen=false;state.selected=new Set();state.win=null;
  state.seconds=cfg.minutes*60;state.deadline=0;state.paused=false;
  go('roles');
}
function roleHTML(){const impostor=state.impostorIds.includes(state.active);
  return `<div class="role-card ${impostor?'impostor':'crew'}" id="secret-card" hidden aria-label="Tarjeta confidencial"><div class="role-kicker">${impostor?'TU PAPEL':'TU PALABRA'}</div><div class="role-word">${impostor?'ERES EL IMPOSTOR':esc(state.word)}</div><div class="role-desc">${impostor?'No conoces la palabra. Escucha a los demás e improvisa una pista creíble.':'Solo tú puedes mirar esta tarjeta. Da una pista sin decir la palabra.'}</div></div>`
}
function showSecret(){
  if(state.screen!=='roles')return;
  const hidden=document.getElementById('hidden-card'),secret=document.getElementById('secret-card');
  if(!hidden||!secret)return;
  state.visible=true;state.seen=true;hidden.hidden=true;secret.hidden=false;
  document.getElementById('role-help').textContent='Oculta la tarjeta antes de continuar.';
  const next=document.getElementById('next-role');if(next)next.disabled=true;
  persist();
}
function hideSecret(){
  if(state.screen!=='roles'||!state.visible)return;
  state.visible=false;const hidden=document.getElementById('hidden-card'),secret=document.getElementById('secret-card');
  if(hidden)hidden.hidden=false;if(secret)secret.hidden=true;
  const next=document.getElementById('next-role');if(next)next.disabled=!state.seen;
  const help=document.getElementById('role-help');if(help)help.textContent='Tarjeta oculta. Ya puedes pasar el móvil.';
  const acces=document.getElementById('accessible-reveal');if(acces)acces.textContent='Mostrar tarjeta sin mantener pulsado';
  persist();
}
function renderRoles(){
  const name=state.players[state.active],n=state.players.length;
  const progress=state.players.map((_,i)=>`<span class="${i<state.active?'done':i===state.active?'current':''}"></span>`).join('');
  app.innerHTML=`<div class="stage">${header(`Ronda ${state.round} · Reparto`, 'Solo para tus ojos', 'Asegúrate de que los demás no estén mirando.')}
  <section class="stage-card"><div class="turn-label">Jugador ${state.active+1} de ${n}</div><h2 class="player-name">${esc(name)}</h2><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${state.active+1}" aria-label="Jugadores que han recibido su papel">${progress}</div>
  <div class="hidden-card" id="hidden-card"><div><div class="symbol">?</div><p>Tu papel está <strong>oculto</strong>. Míralo sin que nadie vea la pantalla.</p></div></div>${roleHTML()}
  <button id="hold-reveal" type="button" class="btn btn-secondary btn-wide small-space secret-hold" aria-label="Mantén pulsado para mostrar tu papel">Mantén pulsado para ver <span aria-hidden="true">◉</span></button>
  <p class="notice" aria-live="polite" id="role-help">${state.seen?'Ya has visto tu papel.':'Mantén el botón pulsado. Al soltarlo, la tarjeta se oculta.'}</p>
  <button id="next-role" type="button" class="btn btn-primary btn-wide small-space" ${state.seen?'':'disabled'}>${state.active===n-1?'Terminar reparto':'Ocultar y pasar a la siguiente persona'} →</button>
  <button id="accessible-reveal" type="button" class="tiny-btn btn-wide accessibility-reveal" aria-label="Mostrar u ocultar la tarjeta mediante toque">Mostrar tarjeta sin mantener pulsado</button></section><div class="exit-wrap">${exitButton()}</div></div>`;
  const hold=document.getElementById('hold-reveal');
  hold.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();try{hold.setPointerCapture(e.pointerId)}catch{}showSecret()});
  for(const evt of ['pointerup','pointercancel','lostpointercapture'])hold.addEventListener(evt,hideSecret);
  hold.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showSecret()}});
  hold.addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hideSecret()}});
  document.getElementById('accessible-reveal').addEventListener('click',e=>{if(state.visible)hideSecret();else{showSecret();e.currentTarget.textContent='Ocultar tarjeta'}});
  document.getElementById('next-role').addEventListener('click',()=>{
    if(!state.seen||state.visible)return;
    if(state.active<n-1){state.active++;state.visible=false;state.seen=false;render();navigate()}
    else go('ready');
  });
  wireExit();
}
function renderReady(){
  app.innerHTML=`<div class="stage">${header(`Ronda ${state.round}`, 'Todos preparados', 'Los papeles ya están repartidos. Empieza el juego.')}
  <section class="stage-card"><div class="turn-label">Empieza hablando</div><h2 class="player-name highlight">${esc(state.starter)}</h2>
  <div class="guide">Por orden, cada jugador dice <strong>una palabra relacionada</strong> con el concepto secreto. El impostor tendrá que inventarse una pista. Podéis dar varias vueltas.</div>
  <div class="round-spot"><div class="spot"><span class="big">${state.players.length}</span><span class="small">jugadores</span></div><div class="spot"><span class="big">${state.impostorIds.length}</span><span class="small">impostor${state.impostorIds.length===1?'':'es'}</span></div><div class="spot"><span class="big">${state.config.minutes===0?'∞':state.config.minutes+' min'}</span><span class="small">debate</span></div></div>
  <button id="start-timer" class="btn btn-primary btn-wide">Empezar debate →</button>
  <p class="notice">El primer jugador se elige al azar en cada ronda.</p></section><div class="exit-wrap">${exitButton()}</div></div>`;
  document.getElementById('start-timer').addEventListener('click',()=>{state.seconds=state.config.minutes*60;state.paused=false;state.deadline=Date.now()+state.seconds*1000;go('playing')});wireExit();
}
function timeStr(total){return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`}
function tick(){
  if(state.screen!=='playing'||state.paused||state.config.minutes===0)return;
  state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
  const clock=document.getElementById('timer');
  if(clock){clock.textContent=timeStr(state.seconds);clock.classList.toggle('ending',state.seconds<=30)}
  if(state.seconds===0){haltTimer();state.paused=true;state.deadline=0;document.getElementById('clock-tip').textContent='¡Tiempo agotado! Podéis votar cuando queráis.';document.getElementById('pause').disabled=true;persist()}
}
function renderPlaying(){
  const timed=state.config.minutes>0;
  app.innerHTML=`<div class="stage">${header(`Ronda ${state.round}`, 'Hablad. Desconfiad.', 'Cada pista puede delatar a alguien.')}
  <section class="stage-card"><div class="turn-label">Tiempo de debate</div><div class="clock-panel"><div id="timer" class="timer ${state.seconds<=30?'ending':''}" role="timer" aria-label="Tiempo restante">${timed?timeStr(state.seconds):'∞'}</div><div class="clock-tip" id="clock-tip">${!timed?'Sin límite de tiempo':state.seconds===0?'¡Tiempo agotado! Podéis votar cuando queráis.':state.paused?'Temporizador en pausa':'Cuenta atrás para debatir'}</div></div>
  ${timed?`<div class="btn-row"><button id="pause" class="btn btn-secondary" ${state.seconds===0?'disabled':''}>${state.paused?'Reanudar':'Pausar'} ${state.paused?'▶':'Ⅱ'}</button><button id="add-time" class="btn btn-secondary">+ 30 s</button></div>`:''}
  <button id="vote" class="btn btn-primary btn-wide small-space">Ir a la votación →</button>
  <div class="guide"><strong>Normas:</strong> no digáis la palabra secreta, no enseñéis el móvil y no repitáis pistas. Al acabar, votad a quienes creáis que son impostores.</div>
  </section><div class="exit-wrap">${exitButton()}</div></div>`;
  if(timed){
    if(!state.paused&&state.seconds>0){tick();if(!state.paused)state.timerId=setInterval(tick,250)}
    document.getElementById('pause').addEventListener('click',()=>{
      if(!state.paused){tick();state.paused=true;haltTimer()}
      else{state.paused=false;state.deadline=Date.now()+state.seconds*1000}
      render();
    });
    document.getElementById('add-time').addEventListener('click',()=>{
      state.seconds+=30;
      if(state.paused){state.deadline=0;}else{state.deadline=Date.now()+state.seconds*1000}
      render();
    });
  }
  document.getElementById('vote').addEventListener('click',()=>{if(timed&&!state.paused){tick();state.paused=true}go('vote')});wireExit();
}
function renderVote(){
  const total=state.impostorIds.length,c=state.selected.size;
  app.innerHTML=`<div class="stage">${header(`Ronda ${state.round} · Votación`, '¿Quién está fingiendo?', 'Poneos de acuerdo antes de revelar las identidades.')}
  <section class="stage-card"><div class="turn-label">Decisión del grupo</div><h2 class="subhead">Señalad ${total} sospechoso${total===1?'':'s'}. Debéis descubrirlos a todos para ganar.</h2>
  <div class="vote-grid">${state.players.map((name,i)=>`<button class="vote ${state.selected.has(i)?'selected':''}" type="button" data-player="${i}" aria-pressed="${state.selected.has(i)}"><span>${esc(name)}</span><span class="check" aria-hidden="true">${state.selected.has(i)?'✓':''}</span></button>`).join('')}</div>
  <p class="vote-msg" id="vote-count">Seleccionados: <strong>${c} de ${total}</strong></p>
  <button id="confirm-vote" class="btn btn-primary btn-wide small-space" ${c===total?'':'disabled'}>Confirmar y revelar papeles →</button>
  <button id="return-talk" class="btn btn-secondary btn-wide small-space">← Volver al debate</button>
  <p class="notice">La palabra secreta y los impostores aparecerán al confirmar.</p></section><div class="exit-wrap">${exitButton()}</div></div>`;
  document.querySelectorAll('[data-player]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.player);if(state.selected.has(i))state.selected.delete(i);else if(state.selected.size<total)state.selected.add(i);render();}));
  document.getElementById('confirm-vote').addEventListener('click',()=>{
    if(state.selected.size!==total)return;
    state.win=state.impostorIds.every(i=>state.selected.has(i));
    state.scores[state.win?'team':'impostors']++;
    go('results');
  });
  document.getElementById('return-talk').addEventListener('click',()=>{state.paused=true;go('playing')});wireExit();
}
function renderResults(){
  const success=state.win;
  app.innerHTML=`<div class="stage">${header(`Ronda ${state.round} · Resultado`,success?'Caso resuelto':'El impostor se ha escapado',success?'Habéis descubierto a todos los impostores.':'Al menos uno ha conseguido engañaros.')}
  <section class="stage-card"><div class="result-hero ${success?'won':'lost'}"><div class="result-symbol" aria-hidden="true">${success?'✦':'?'}</div><h2>${success?'¡Gana el equipo!':'¡Ganan los impostores!'}</h2></div>
  <div class="result-word">La palabra secreta era<br><strong>${esc(state.word)}</strong></div>
  <div class="section-label">Identidades reveladas</div><div class="results">${state.players.map((n,i)=>`<div class="result-player"><span class="r-name">${esc(n)}${state.selected.has(i)?'<span title="Acusado por el grupo"> · ⚑</span>':''}</span><span class="tag ${state.impostorIds.includes(i)?'impostor':'crew'}">${state.impostorIds.includes(i)?'Impostor':'Conocía la palabra'}</span></div>`).join('')}</div>
  <div class="section-label">Marcador de la sesión</div><div class="scoreline"><div><strong style="color:var(--lime)">${state.scores.team}</strong><span>Rondas del equipo</span></div><div><strong style="color:var(--pink)">${state.scores.impostors}</strong><span>Rondas de los impostores</span></div></div>
  <p class="notice">Los impostores se reparten de forma equilibrada en las siguientes rondas.</p>
  <button id="next-round" class="btn btn-primary btn-wide small-space">Jugar otra ronda →</button>
  <button id="new-setup" class="btn btn-secondary btn-wide small-space">Cambiar jugadores o ajustes</button>
  </section></div>`;
  document.getElementById('next-round').addEventListener('click',()=>startRound(state.players,state.config));
  document.getElementById('new-setup').addEventListener('click',()=>{clearSession();state=initialState();render();navigate()});
}
// Protección básica: ocultar inmediatamente el papel al cambiar de pestaña, aplicación o ventana.
document.addEventListener('visibilitychange',()=>{if(document.hidden)hideSecret()});
window.addEventListener('blur',hideSecret);
window.addEventListener('pagehide',hideSecret);
loadSession();render();

</script>
