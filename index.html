const METADATA = {};
for(const [category,words] of Object.entries(BANK)){
  const wordMap = new Map(words.map((word,i)=>[word,{hint:PRIVATE_HINTS[category][i]}]));
  for(const [subcategory, rawWords] of SUBTOPICS[category]){
    for(const word of rawWords.split('|')){
      const entry=wordMap.get(word);
      if(!entry || entry.subcategory)throw Error(`Banco incompleto: ${category} / ${word}`);
      entry.subcategory=subcategory;
    }
  }
  if([...wordMap.values()].some(item=>!item.subcategory||!item.hint))throw Error(`Faltan datos en ${category}`);
  METADATA[category]=Object.fromEntries(wordMap);
}

function rand(max){
  if(max<=1)return 0;
  if(globalThis.crypto?.getRandomValues){
    const limit=Math.floor(4294967296/max)*max, buf=new Uint32Array(1);let n;
    do {crypto.getRandomValues(buf);n=buf[0]} while(n>=limit);
    return n%max;
  }
  return Math.floor(Math.random()*max);
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function parseNames(raw){return String(raw).split(/[\n;,]+/).map(s=>s.trim()).filter(Boolean)}
function parseCustomEntries(raw){
  const rows=String(raw).split(/[\n;]+/).map(s=>s.trim()).filter(Boolean);
  const entries=rows.map(line=>{
    const [word, subcategory, hint] = line.split('|').map(v=>v?.trim()||'');
    return {word,category:'Mi lista',subcategory:subcategory||'Palabras de la casa',hint:hint||'Es una palabra elegida por vuestra propia mesa.'};
  }).filter(entry=>entry.word);
  return [...new Map(entries.map(entry=>[normalize(entry.word),entry])).values()];
}
function parseWords(raw){return parseCustomEntries(raw).map(x=>x.word)}
function allWords(){return Object.values(BANK).flat()}
function categoryWords(category,cfg){if(category==='Mi lista')return parseWords(cfg.customWords);return category==='Todas'?allWords():(BANK[category]||allWords())}
function pickWord(category,cfg){
  // «Todas» elige entre todas las categorías, pero nunca pierde el contexto.
  const pool=category==='Mi lista'
    ?parseCustomEntries(cfg.customWords)
    :(category==='Todas'?Object.entries(BANK):[[category,BANK[category]||[]]])
      .flatMap(([cat,words])=>words.map(word=>({word,category:cat,subcategory:METADATA[cat][word].subcategory,hint:METADATA[cat][word].hint})));
  const seen=new Set(state.recent.map(normalize));
  let available=pool.filter(item=>!seen.has(normalize(item.word)));
  if(!available.length){state.recent=[];available=pool}
  const picked=available[rand(available.length)];
  state.recent.push(picked.word);
  if(state.recent.length>Math.max(1,pool.length-1))state.recent.shift();
  return picked;
}
function pickImpostors(n,k){
  const counts=Array.from({length:n},(_,i)=>state.counts[i]||0);
  const ordered=shuffle([...Array(n).keys()]);
  ordered.sort((a,b)=>(counts[a]+(state.previous.includes(a)?0.7:0))-(counts[b]+(state.previous.includes(b)?0.7:0)));
  const chosen=ordered.slice(0,k);
  chosen.forEach(i=>{counts[i]+=1});
  state.counts=counts;state.previous=[...chosen];
  return chosen;
}

  <section class="stage-card">${categoryBanner()}<div class="result-hero ${success?'won':'lost'}"><div class="result-symbol" aria-hidden="true">${success?'✦':'?'}</div><h2>${success?(houseMode()?'Milagro, habéis acertado.':'¡Gana el equipo!'):(houseMode()?'Vaya panda de lumbreras.':'¡Ganan los impostores!')}</h2></div>
  ${houseBanter(success)}<div class="result-word">La palabra secreta era<br><strong>${esc(state.word)}</strong></div>
  <div class="section-label">Identidades reveladas</div><div class="results">${state.players.map((n,i)=>`<div class="result-player"><span class="r-name">${esc(n)}${state.selected.has(i)?'<span title="Acusado por el grupo"> · ⚑</span>':''}</span><span class="tag ${state.impostorIds.includes(i)?'impostor':'crew'}">${state.impostorIds.includes(i)?'Impostor':'Conocía la palabra'}</span></div>`).join('')}</div>
  <div class="section-label">Marcador de la sesión</div><div class="scoreline"><div><strong style="color:var(--lime)">${state.scores.team}</strong><span>Rondas del equipo</span></div><div><strong style="color:var(--pink)">${state.scores.impostors}</strong><span>Rondas de los impostores</span></div></div>
  <p class="notice">Los impostores rotan. Ninguno de los de esta ronda empezará el siguiente reparto ni las pistas.</p>
  <button id="next-round" class="btn btn-primary btn-wide small-space">Otra ronda, cobardes →</button>
  <button id="new-setup" class="btn btn-secondary btn-wide small-space">Cambiar la banda o las reglas</button>
  </section></div>`;
  document.getElementById('next-round').addEventListener('click',()=>startRound(state.players,state.config));
  document.getElementById('new-setup').addEventListener('click',()=>{clearSession();state=initialState();render();navigate()});
}
// Protección básica: ocultar inmediatamente el papel al cambiar de pestaña, aplicación o ventana.
document.addEventListener('visibilitychange',()=>{if(document.hidden)hideSecret()});
window.addEventListener('blur',hideSecret);
window.addEventListener('pagehide',hideSecret);
loadSession();render();

</script>
</body>
</html>
